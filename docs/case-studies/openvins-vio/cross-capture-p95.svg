<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">OpenVINS position-error p95 across captured datasets</title>
  <desc id="desc">Grouped bars compare nominal 20 degree camera tilt with the best-tested 20.8 degree tilt. Capture 04 worsens from 1.519 to 2.409 meters, capture 05 improves from 34.095 to 14.042 meters, capture 06 improves from 20.821 to 4.779 meters, and the three-capture mean improves from 18.812 to 7.077 meters.</desc>
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#172033">Position-error p95 across captured datasets</text>
  <text x="450" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#596579">Lower is better; 20.8 degrees improved two captures but worsened capture 04</text>

  <g stroke="#d9dee8" stroke-width="1">
    <line x1="90" y1="430" x2="850" y2="430"/>
    <line x1="90" y1="382.8" x2="850" y2="382.8"/>
    <line x1="90" y1="335.6" x2="850" y2="335.6"/>
    <line x1="90" y1="288.3" x2="850" y2="288.3"/>
    <line x1="90" y1="241.1" x2="850" y2="241.1"/>
    <line x1="90" y1="193.9" x2="850" y2="193.9"/>
    <line x1="90" y1="146.7" x2="850" y2="146.7"/>
    <line x1="90" y1="99.4" x2="850" y2="99.4"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="12" fill="#596579" text-anchor="end">
    <text x="80" y="434">0</text>
    <text x="80" y="386.8">5</text>
    <text x="80" y="339.6">10</text>
    <text x="80" y="292.3">15</text>
    <text x="80" y="245.1">20</text>
    <text x="80" y="197.9">25</text>
    <text x="80" y="150.7">30</text>
    <text x="80" y="103.4">35</text>
  </g>
  <text x="24" y="260" transform="rotate(-90 24 260)" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#3b4658">Position-error p95 (m)</text>

  <g fill="#345995">
    <rect x="160" y="415.7" width="42" height="14.3" rx="3"/>
    <rect x="340" y="108.0" width="42" height="322.0" rx="3"/>
    <rect x="520" y="233.3" width="42" height="196.7" rx="3"/>
    <rect x="700" y="252.3" width="42" height="177.7" rx="3"/>
  </g>
  <g fill="#e07a2f">
    <rect x="210" y="407.2" width="42" height="22.8" rx="3"/>
    <rect x="390" y="297.4" width="42" height="132.6" rx="3"/>
    <rect x="570" y="384.9" width="42" height="45.1" rx="3"/>
    <rect x="750" y="363.2" width="42" height="66.8" rx="3"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="12" fill="#172033" text-anchor="middle">
    <text x="181" y="409">1.519</text>
    <text x="231" y="401">2.409</text>
    <text x="361" y="101">34.095</text>
    <text x="411" y="291">14.042</text>
    <text x="541" y="227">20.821</text>
    <text x="591" y="379">4.779</text>
    <text x="721" y="246">18.812</text>
    <text x="771" y="357">7.077</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="13" fill="#3b4658" text-anchor="middle">
    <text x="206" y="455">Capture 04</text>
    <text x="386" y="455">Capture 05</text>
    <text x="566" y="455">Capture 06</text>
    <text x="746" y="455">Mean</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="13" fill="#3b4658">
    <rect x="293" y="481" width="16" height="16" rx="2" fill="#345995"/>
    <text x="317" y="494">Nominal 20 degrees</text>
    <rect x="498" y="481" width="16" height="16" rx="2" fill="#e07a2f"/>
    <text x="522" y="494">Tested 20.8 degrees</text>
  </g>
</svg>
